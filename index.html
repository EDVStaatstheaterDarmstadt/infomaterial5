<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<script>
  const lang = navigator.language || navigator.userLanguage;

  if (lang.startsWith("de")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/SAZ5nRzYFr8eaWb";
  } else if (lang.startsWith("en")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/RrSyAMZSBWfXYaD";
  } else if (lang.startsWith("fr")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/7qYesDzmkoLFdJM";
  } else if (lang.startsWith("ar")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/dmqjAATD6bXNFkA";
  } else if (lang.startsWith("zh")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/MNpeNSg6g5ZtXZZ";
  } else if (lang.startsWith("tr")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/stiGqGGqoKp34xq";
  } else if (lang.startsWith("ko")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/wJkY42TpNyaiHmS";
  } else if (lang.startsWith("pt")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/kSgMs3fEF9PcWzc";
  } else if (lang.startsWith("ru")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/MdoAoaP5ianxtqz";
  } else if (lang.startsWith("uk")) {
    window.location.href = "https://cloud.staatstheater-darmstadt.de/s/HXGJJgaRTbDSHtk";
  } else {
    // Optionaler Fallback, falls keine der oben genannten Sprachen zutrifft
    window.location.href = "https://URL2.de"; // z. B. englische Standardseite
  }
</script>

<p>Sie werden weitergeleitet…</p>
</body>
</html>
